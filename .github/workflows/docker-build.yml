name: Docker Build & Publish
on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment (staging/prod)"
        required: false
        type: string
        default: ""
      version_tag:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-26.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Install dependencies
        run: mix deps.get --check-locked
      - name: Verify
        run: |
          mix format --check-formatted
          MIX_ENV=test mix compile --warnings-as-errors
          MIX_ENV=test mix test

  build-and-push:
    needs: verify
    runs-on: arc-runner-set
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine tags and environment
        id: vars
        # Inputs arrive through env, never spliced into the script, so a crafted
        # value cannot run as shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          SHA: ${{ github.sha }}
        run: |
          valid_tag='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          if [[ "$EVENT_NAME" == "release" ]]; then
            [[ "$REF_NAME" =~ $valid_tag ]] || { echo "release tag is not a valid image tag" >&2; exit 1; }
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "float_tag=latest" >> "$GITHUB_OUTPUT"
            echo "version_tag=ghcr.io/maybesidequest/prism:${REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VERSION_TAG" ]]; then
            [[ "$INPUT_VERSION_TAG" =~ $valid_tag ]] || { echo "version_tag is not a valid image tag" >&2; exit 1; }
            [[ "$INPUT_ENVIRONMENT" == "prod" || "$INPUT_ENVIRONMENT" == "staging" ]] || { echo "environment must be prod or staging" >&2; exit 1; }
            echo "environment=${INPUT_ENVIRONMENT}" >> "$GITHUB_OUTPUT"
            echo "float_tag=latest" >> "$GITHUB_OUTPUT"
            echo "version_tag=ghcr.io/maybesidequest/prism:${INPUT_VERSION_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "float_tag=staging" >> "$GITHUB_OUTPUT"
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_tag=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ARC runners start every job with an empty BuildKit, so layer reuse
          # across runs comes only from this registry cache. A failed cache
          # export must never fail the deploy.
          cache-from: type=registry,ref=ghcr.io/maybesidequest/prism:buildcache
          cache-to: type=registry,ref=ghcr.io/maybesidequest/prism:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          tags: |
            ghcr.io/maybesidequest/prism:${{ steps.vars.outputs.sha_tag }}
            ghcr.io/maybesidequest/prism:${{ steps.vars.outputs.float_tag }}
            ${{ steps.vars.outputs.version_tag }}

      - name: Update GitOps repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          ENV: ${{ steps.vars.outputs.environment }}
          SHA: ${{ steps.vars.outputs.sha_tag }}
        run: |
          APP_DIR="prism"

          git clone --depth 1 \
            "https://x-access-token:${GITOPS_PAT}@github.com/maybesidequest/interchat-kube-talos.git" \
            /tmp/gitops

          cd /tmp/gitops

          KUSTOMIZATION="kubernetes/apps/${APP_DIR}/overlays/${ENV}/kustomization.yaml"

          sed -i "s/newTag:.*/newTag: ${SHA}/" "$KUSTOMIZATION"

          git config user.name "ci-bot"
          git config user.email "ci-bot@interchat.fun"
          git add "$KUSTOMIZATION"
          git commit -m "deploy(${APP_DIR}-${ENV}): ${SHA}" || echo "No changes to commit"
          # Other services push deploy commits to the same branch; rebase onto
          # theirs and retry instead of failing the release on a race.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing and retrying" >&2
            sleep $((attempt * 2))
            git pull --rebase origin main
          done
          echo "could not push the GitOps update after 5 attempts" >&2
          exit 1
